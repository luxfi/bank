name: Mirror to git.hanzo.ai

# The ONLY GitHub Actions workflow this repo carries — and it runs ZERO CI.
#
# git.hanzo.ai is CANONICAL; GitHub is a MIRROR. Build and deploy are NATIVE:
# platform.hanzo.ai builds from the repo's root `hanzo.yml`, cd.hanzo.ai delivers.
# GitHub Actions' single remaining job is to tell the canonical forge that a push
# happened. Do not add build, test, deploy, or image-push steps to this file —
# that would restore the duplicate orchestrator (arcd) this migration removed.

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch: {}

jobs:
  mirror:
    uses: hanzoai/.github/.github/workflows/mirror.yml@main
    secrets: inherit
