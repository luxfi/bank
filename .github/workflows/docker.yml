name: Docker
on:
  workflow_dispatch:
  push:
    branches: [main, dev, test]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  docker:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/luxfi/bank
      # Native multi-arch on lux-org ARC scale-sets — no QEMU.
      runner-amd64: lux-build-linux-amd64
      runner-arm64: lux-build-linux-arm64
      runner-deploy: lux-build-linux-amd64
