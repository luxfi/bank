name: Docker

# Single-arch (linux/amd64) container build on the working `lux-build` ARC label.
# Multi-arch (arm64) will return once the per-arch `lux-build-linux-arm64`
# pool is verified online (current per-arch labels did not pick up jobs).
# No QEMU, no cross-org reusable.

on:
  workflow_dispatch:
  push:
    branches: [main, dev, test]
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/luxfi/bank

jobs:
  build:
    runs-on: [self-hosted, linux, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        run: |
          set -e
          tags=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/}"
            tags="ghcr.io/luxfi/bank:${v},ghcr.io/luxfi/bank:latest"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            tags="ghcr.io/luxfi/bank:main"
          elif [[ "${GITHUB_REF}" == refs/heads/dev ]]; then
            tags="ghcr.io/luxfi/bank:dev"
          elif [[ "${GITHUB_REF}" == refs/heads/test ]]; then
            tags="ghcr.io/luxfi/bank:test"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - name: Build & push
        if: steps.meta.outputs.tags != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
