name: Docker

# Builds both images on a version tag (semver-only): bankd + the customer dash.
# Single-arch linux/amd64 on the luxfi ARC pool. ARC v0.14 routes by scale-set
# NAME (lux-build-linux-amd64), not labels — a [self-hosted,linux,amd64] label
# array never dispatches (jobs queue forever). Must name the pool. No cross-org.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [lux-build-linux-amd64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bank
            context: .
            dockerfile: Dockerfile
          - image: bank-dash
            context: ./app/dash
            dockerfile: ./app/dash/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Compute tags
        id: meta
        run: |
          set -e
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/}"
            echo "tags=ghcr.io/luxfi/${{ matrix.image }}:${v},ghcr.io/luxfi/${{ matrix.image }}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/luxfi/${{ matrix.image }}:latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
